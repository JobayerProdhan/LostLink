<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register — LostLink</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <a href="/" class="logo">
            <span>Lost</span>Link
        </a>

        <h1>Create account</h1>

        <p class="subtitle">
            Join LostLink and help reconnect lost items.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="post">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="switch">
            Already have an account?
            <a href="/login">Log in</a>
        </p>

    </div>

</div>

</body>
</html>
